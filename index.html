<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fries Factory - Restaurant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Fries Factory</h1>
    <p>Opening Hours: 9:30 AM – 9:30 PM</p>
  </header>

  <section class="menu-section">
  <h2>Menu</h2>

  <div class="menu-category">
    <h3>Sandwich</h3>
    <ul>
      <li>
        Cheese Corn Sandwich - ₹59
        <button class="add-to-cart" data-name="Cheese Corn Sandwich" data-price="59">Add to Cart</button>
      </li>
      <li>
        Veg Cheese Sandwich - ₹69
        <button class="add-to-cart" data-name="Veg Cheese Sandwich" data-price="69">Add to Cart</button>
      </li>
      <li>
        Garlic Veg Cheese Corn Sandwich - ₹79
        <button class="add-to-cart" data-name="Garlic Veg Cheese Corn Sandwich" data-price="79">Add to Cart</button>
      </li>
      <!-- Add other menu items similarly -->
    </ul>
  </div>

  <div class="menu-category">
    <h3>Drinks</h3>
    <ul>
      <li>
        Virgin Mojito - ₹70
        <button class="add-to-cart" data-name="Virgin Mojito" data-price="70">Add to Cart</button>
      </li>
      <!-- Add other drinks similarly -->
    </ul>
  </div>

  <h3>Your Cart:</h3>
  <ul id="cart-items"></ul>
  <p>Total: ₹<span id="cart-total">0</span></p>

  <button id="checkout">Order via WhatsApp</button>
    </section>
      <label for="name">Name:</label><br/>
      <input type="text" id="name" name="name" required /><br/>

      <label for="phone">Phone Number:</label><br/>
      <input type="tel" id="phone" name="phone" required /><br/>

      <label for="orderDetails">Order Details:</label><br/>
      <textarea id="orderDetails" name="orderDetails" rows="4" required></textarea><br/>

      <button type="submit">Order via WhatsApp</button>
    </form>
  </section>

  
  <script>
    document.getElementById('orderForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = encodeURIComponent(document.getElementById('name').value.trim());
      const phone = encodeURIComponent(document.getElementById('phone').value.trim());
      const orderDetails = encodeURIComponent(document.getElementById('orderDetails').value.trim());

      const message = `Hello, I want to place an order.%0AName: ${name}%0APhone: ${phone}%0AOrder Details: ${orderDetails}`;

      const whatsappUrl = `https://wa.me/917063385345?text=${message}`;
      window.open(whatsappUrl, '_blank');
    });
  </script>

</body>
</html>
